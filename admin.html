<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - Shoe Collection</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{
background:#0b0b0b;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:#fff;
padding:20px;
}
.card{
width:100%;
max-width:380px;
background:#151515;
padding:30px;
border-radius:18px;
box-shadow:0 0 25px rgba(0,0,0,.4);
}
h1{
text-align:center;
margin-bottom:25px;
}
input{
width:100%;
padding:15px;
margin-bottom:15px;
background:#0f0f0f;
border:1px solid #333;
border-radius:10px;
color:#fff;
font-size:15px;
}
button{
width:100%;
padding:15px;
background:#25D366;
border:none;
border-radius:10px;
color:white;
font-weight:700;
font-size:16px;
cursor:pointer;
}
button:hover{
background:#20bf5a;
}
#msg{
margin-top:15px;
text-align:center;
font-size:14px;
color:#bbb;
}
</style>
</head>

<body>

<div class="card">
<h1>Admin Login</h1>

<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button id="loginBtn">Login</button>

<p id="msg">Only Shop Owner can access.</p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
 apiKey:"AIzaSyD8fVEBmZDsbT2HAkeghb9VwviW8Kqe-Ds",
 authDomain:"shoess-collection.firebaseapp.com",
 projectId:"shoess-collection",
 storageBucket:"shoess-collection.firebasestorage.app",
 messagingSenderId:"947805916030",
 appId:"1:947805916030:web:6a8efeb305c258a78f412f"
};

firebase.initializeApp(firebaseConfig);

const msg=document.getElementById("msg");

document.getElementById("loginBtn").onclick=async()=>{

 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value.trim();

 if(!email||!password){
   msg.innerText="Email aur Password bharo.";
   msg.style.color="orange";
   return;
 }

 try{

   await firebase.auth().signInWithEmailAndPassword(email,password);

   msg.innerText="Login Successful...";
   msg.style.color="#25D366";

   setTimeout(()=>{
      window.location.href="dashboard.html";
   },800);

 }catch(e){

   msg.innerText=e.message;
   msg.style.color="red";

 }

};
</script>

</body>
</html>
