
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dashboard - Shoe Collection</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{background:#0b0b0b;color:#fff}
.container{max-width:1100px;margin:auto;padding:20px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
button{cursor:pointer;border:none;border-radius:10px;padding:12px 16px;font-weight:600}
.logout{background:#dc2626;color:#fff}
.add{background:#25D366;color:#fff;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin:20px 0}
.box,.form,.card{background:#151515;border-radius:16px;padding:18px}
input,select{width:100%;padding:13px;margin:8px 0;background:#0f0f0f;border:1px solid #333;border-radius:10px;color:#fff}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.card img{width:100%;height:180px;object-fit:cover;border-radius:12px;margin-bottom:12px}
.actions{display:flex;gap:8px;margin-top:10px}
.actions button{flex:1;color:#fff}
.blue{background:#2563eb}.orange{background:#f59e0b}.red{background:#dc2626}
</style>

<script src="https://upload-widget.cloudinary.com/global/all.js"></script>
</head>
<body>

<div class="container">

<div class="header">
<h2>Admin Dashboard</h2>
<button id="logoutBtn" class="logout">Logout</button>
</div>

<div class="grid">
<div class="box"><p>Total Products</p><h1 id="total">0</h1></div>
<div class="box"><p>Out Of Stock</p><h1 id="out">0</h1></div>
</div>

<div class="form">
<h3>Add Product</h3>

<input id="name" placeholder="Product Name">
<input id="price" placeholder="Price">
<input id="image" placeholder="Image URL" readonly>

<button id="uploadBtn" type="button">📷 Upload Image</button>

<select id="stock">
<option>In Stock</option>
<option>Out of Stock</option>
</select>

<button id="addBtn" class="add">Add Product</button>
</div>

<div id="products" class="products"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
doc,
updateDoc,
deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyD8fVEBmZDsbT2HAkeghb9VwviW8Kqe-Ds",
authDomain:"shoess-collection.firebaseapp.com",
projectId:"shoess-collection",
storageBucket:"shoess-collection.firebasestorage.app",
messagingSenderId:"947805916030",
appId:"1:947805916030:web:6a8efeb305c258a78f412f"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

onAuthStateChanged(auth,user=>{
if(!user){
location.href="admin.html";
}else{
loadProducts();
}
});

document.getElementById("logoutBtn").onclick=async()=>{
await signOut(auth);
location.href="admin.html";
};

const widget=cloudinary.createUploadWidget({

cloudName:"khi5rknj",

uploadPreset:"Shoess collection"

},(error,result)=>{

if(!error && result && result.event==="success"){

document.getElementById("image").value=result.info.secure_url;

}

});

document.getElementById("uploadBtn").onclick=()=>widget.open();

const name=document.getElementById("name");
const price=document.getElementById("price");
const image=document.getElementById("image");
const stock=document.getElementById("stock");

document.getElementById("addBtn").onclick=async()=>{

if(!name.value||!price.value||!image.value){

alert("Fill all fields");

return;

}

await addDoc(collection(db,"products"),{

name:name.value,

price:price.value,

image:image.value,

status:stock.value

});

name.value="";
price.value="";
image.value="";

loadProducts();

};

async function loadProducts(){

const wrap=document.getElementById("products");

wrap.innerHTML="";

let total=0;
let out=0;

const snap=await getDocs(collection(db,"products"));

snap.forEach(d=>{

const p=d.data();

total++;

if((p.status||"In Stock")==="Out of Stock") out++;

wrap.innerHTML+=`

<div class="card">

<img src="${p.image}">

<h3>${p.name}</h3>

<p>₹${p.price}</p>

<p>${p.status||"In Stock"}</p>

<div class="actions">

<button class="blue" onclick="editProduct('${d.id}','${p.name}','${p.price}')">Edit</button>

<button class="orange" onclick="toggleStock('${d.id}','${p.status||"In Stock"}')">Stock</button>

<button class="red" onclick="deleteProduct('${d.id}')">Delete</button>

</div>

</div>

`;

});

document.getElementById("total").innerText=total;

document.getElementById("out").innerText=out;

}

window.deleteProduct=async(id)=>{

if(confirm("Delete Product?")){

await deleteDoc(doc(db,"products",id));

loadProducts();

}

};

window.toggleStock=async(id,status)=>{

await updateDoc(doc(db,"products",id),{

status:status==="In Stock"

?"Out of Stock"

:"In Stock"

});

loadProducts();

};

window.editProduct=async(id,n,p)=>{

const newName=prompt("Product Name",n);

const newPrice=prompt("Price",p);

if(newName&&newPrice){

await updateDoc(doc(db,"products",id),{

name:newName,

price:newPrice

});

loadProducts();

}

};

</script>

</body>
</html>
