<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Shoe Collection</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://upload-widget.cloudinary.com/global/all.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{background:#0b0b0b;color:#fff}
.container{max-width:1100px;margin:auto;padding:20px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.logout{background:#dc2626;color:#fff;border:none;padding:12px 20px;border-radius:12px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:15px;margin-bottom:20px}
.box,.form,.card{background:#151515;border-radius:18px;padding:18px}
.box h1{text-align:center;margin-top:10px}
input,select{
width:100%;
padding:14px;
margin:8px 0;
background:#0b0b0b;
border:1px solid #333;
border-radius:12px;
color:#fff;
}
button{cursor:pointer;border:none;border-radius:12px;font-weight:600}
.upload{background:#fff;color:#111;padding:12px 20px;margin-top:5px}
.add{background:#25D366;color:#fff;padding:15px;width:100%;margin-top:10px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-top:20px}
.card{overflow:hidden;padding:0}
.card img{width:100%;height:230px;object-fit:cover}
.info{padding:15px}
.price{font-size:22px;font-weight:700}
.old{color:#777;text-decoration:line-through}
.badge{display:inline-block;padding:6px 14px;border-radius:20px;font-size:13px;margin:10px 0}
.in{background:#166534}
.out{background:#9a3412}
.actions{display:flex;gap:8px}
.actions button{flex:1;padding:10px;color:#fff}
.blue{background:#2563eb}
.orange{background:#f59e0b}
.red{background:#dc2626}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h2>Admin Dashboard</h2>
<button id="logoutBtn" class="logout">Logout</button>
</div>

<div class="grid">
<div class="box">
<p>Total Products</p>
<h1 id="total">0</h1>
</div>

<div class="box">
<p>Out Of Stock</p>
<h1 id="out">0</h1>
</div>
</div>

<div class="form">

<h3>Add Product</h3>

<input id="name" placeholder="Product Name">

<input id="price" type="number" placeholder="Original Price">

<input id="salePrice" type="number" placeholder="Sale Price">

<input id="image" placeholder="Image URL" readonly>

<select id="brand">
<option value="Nike">Nike</option>
<option value="Adidas">Adidas</option>
<option value="Puma">Puma</option>
<option value="Sports">Sports</option>
</select>

<button id="uploadBtn" class="upload">📷 Upload Image</button>

<select id="stock">
<option value="In Stock">In Stock</option>
<option value="Out of Stock">Out of Stock</option>
</select>

<button id="addBtn" class="add">Add Product</button>

</div>

<div id="products" class="products"></div>

</div>

<script type="module">

import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {getAuth,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {getFirestore,collection,addDoc,getDocs,doc,updateDoc,deleteDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyD8fVEBmZDsbT2HAkeghb9VwviW8Kqe-Ds",
authDomain:"shoess-collection.firebaseapp.com",
projectId:"shoess-collection",
storageBucket:"shoess-collection.firebasestorage.app",
messagingSenderId:"947805916030",
appId:"1:947805916030:web:6a8efeb305c258a78f412f"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const total=document.getElementById("total");
const out=document.getElementById("out");
const productsDiv=document.getElementById("products");

onAuthStateChanged(auth,user=>{
if(!user) location.href="admin.html";
});

document.getElementById("logoutBtn").onclick=()=>signOut(auth);

document.getElementById("uploadBtn").onclick=()=>{

cloudinary.openUploadWidget({

cloudName:"khi5rknj",
uploadPreset:"Shoess collection",
multiple:false

},(error,result)=>{

if(!error && result.event==="success"){

document.getElementById("image").value=result.info.secure_url;

}

});

};

document.getElementById("addBtn").onclick=async()=>{

const name=document.getElementById("name").value.trim();
const price=document.getElementById("price").value.trim();
const salePrice=document.getElementById("salePrice").value.trim();
const image=document.getElementById("image").value.trim();
const brand=document.getElementById("brand").value;
const stock=document.getElementById("stock").value;

if(!name || !price || !salePrice || !image){

alert("Fill all fields");

return;

}

await addDoc(collection(db,"products"),{

name,
price,
salePrice,
image,
category:brand,
status:stock

});

document.getElementById("name").value="";
document.getElementById("price").value="";
document.getElementById("salePrice").value="";
document.getElementById("image").value="";

loadProducts();

};

async function loadProducts(){

productsDiv.innerHTML="";

let totalCount=0;
let outCount=0;

const snap=await getDocs(collection(db,"products"));

snap.forEach(d=>{

const p=d.data();

totalCount++;

if(p.status==="Out of Stock") outCount++;

productsDiv.innerHTML+=`

<div class="card">

<img src="${p.image}">

<div class="info">

<h3>${p.name}</h3>

<div class="price">₹${p.salePrice}</div>

<div class="old">₹${p.price}</div>

<p>${p.category}</p>

<span class="badge ${p.status==="In Stock"?"in":"out"}">${p.status}</span>

<div class="actions">

<button class="blue" onclick="editProduct('${d.id}','${p.name}','${p.price}','${p.salePrice}')">Edit</button>

<button class="orange" onclick="toggleStock('${d.id}','${p.status}')">Stock</button>

<button class="red" onclick="deleteProduct('${d.id}')">Delete</button>

</div>

</div>

</div>

`;

});

total.innerText=totalCount;
out.innerText=outCount;

}

window.deleteProduct=async(id)=>{

if(confirm("Delete Product?")){

await deleteDoc(doc(db,"products",id));

loadProducts();

}

};

window.toggleStock=async(id,status)=>{

await updateDoc(doc(db,"products",id),{

status:status==="In Stock"?"Out of Stock":"In Stock"

});

loadProducts();

};

window.editProduct=async(id,name,price,salePrice)=>{

const newName=prompt("Product Name",name);
const newPrice=prompt("Original Price",price);
const newSale=prompt("Sale Price",salePrice);

if(!newName || !newPrice || !newSale) return;

await updateDoc(doc(db,"products",id),{

name:newName,
price:newPrice,
salePrice:newSale

});

loadProducts();

};

loadProducts();

</script>

</body>
  </html>
