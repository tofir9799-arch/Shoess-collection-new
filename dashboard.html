<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dashboard - Shoe Collection</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://upload-widget.cloudinary.com/global/all.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{background:#0b0b0b;color:#fff}
.container{max-width:1100px;margin:auto;padding:20px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
button{cursor:pointer;border:none;border-radius:12px;padding:12px 18px;font-weight:600}
.logout{background:#dc2626;color:#fff}
.add{background:#25D366;color:#fff;width:100%;margin-top:12px}
.upload{background:#fff;color:#111;width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:15px;margin-bottom:20px}
.box,.form,.card{background:#151515;border-radius:18px;padding:18px}
input,select{width:100%;padding:13px;margin:8px 0;background:#0b0b0b;border:1px solid #333;border-radius:12px;color:#fff}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;margin-top:20px}
.card{padding:0;overflow:hidden}
.card img{width:100%;height:220px;object-fit:cover}
.info{padding:16px}
.info h3{margin-bottom:6px}
.price{font-size:22px;font-weight:700}
.old{text-decoration:line-through;color:#777;font-size:15px}
.badge{display:inline-block;padding:6px 12px;border-radius:20px;font-size:13px;margin:10px 0}
.in{background:#14532d}
.out{background:#7c2d12}
.actions{display:flex;gap:8px}
.actions button{flex:1;color:#fff}
.blue{background:#2563eb}
.orange{background:#f59e0b}
.red{background:#dc2626}
</style>
</head>
<body>

<div class="container">

<div class="header">
<h2>Admin Dashboard</h2>
<button id="logoutBtn" class="logout">Logout</button>
</div>

<div class="grid">
<div class="box"><p>Total Products</p><h1 id="total">0</h1></div>
<div class="box"><p>Out Of Stock</p><h1 id="out">0</h1></div>
</div>

<div class="form">

<h3>Add Product</h3>

<input id="name" placeholder="Product Name">
<input id="price" placeholder="Original Price">
<input id="salePrice" placeholder="Sale Price">

<input id="image" placeholder="Image URL" readonly>

<select id="brand">
<option value="Nike">Nike</option>
<option value="Adidas">Adidas</option>
<option value="Puma">Puma</option>
<option value="Sports">Sports</option>
</select>

<button id="uploadBtn" class="upload">📷 Upload Image</button>

<select id="stock">
<option>In Stock</option>
<option>Out of Stock</option>
</select>

<button id="addBtn" class="add">Add Product</button>

</div>

<div id="products" class="products"></div>

</div>

<script type="module">

import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,addDoc,getDocs,doc,updateDoc,deleteDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyD8fVEBmZDsbT2HAkeghb9VwviW8Kqe-Ds",
authDomain:"shoess-collection.firebaseapp.com",
projectId:"shoess-collection",
storageBucket:"shoess-collection.firebasestorage.app",
messagingSenderId:"947805916030",
appId:"1:947805916030:web:6a8efeb305c258a78f412f"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const image=document.getElementById("image");
const wrap=document.getElementById("products");
const total=document.getElementById("total");
const out=document.getElementById("out");

onAuthStateChanged(auth,user=>{
if(!user) location.href="admin.html";
});

logoutBtn.onclick=()=>signOut(auth);

uploadBtn.onclick=()=>{

cloudinary.openUploadWidget({

cloudName:"khi5rknj",
uploadPreset:"Shoess collection",
multiple:false

},(err,res)=>{

if(!err&&res.event==="success"){

image.value=res.info.secure_url;

}

});

};

addBtn.onclick=async()=>{

if(!name.value||!price.value||!image.value){

alert("Fill all fields");

return;

}

await addDoc(collection(db,"products"),{

name:name.value,
price:price.value,
salePrice:salePrice.value||price.value,
image:image.value,
status:stock.value,
category:brand.value

});

name.value="";
price.value="";
salePrice.value="";
image.value="";

load();

};

async function load(){

wrap.innerHTML="";

const snap=await getDocs(collection(db,"products"));

let t=0,o=0;

snap.forEach(d=>{

const p=d.data();

t++;

if(p.status==="Out of Stock")o++;

wrap.innerHTML+=`

<div class="card">

<img src="${p.image}">

<div class="info">

<h3>${p.name}</h3>

<div class="price">₹${p.salePrice||p.price}</div>

<div class="old">₹${p.price}</div>

<p>${p.category||"Sports"}</p>

<span class="badge ${p.status==="In Stock"?"in":"out"}">

${p.status}

</span>

<div class="actions">

<button class="blue" onclick="editProduct('${d.id}','${p.name}','${p.price}','${p.salePrice||p.price}')">Edit</button>

<button class="orange" onclick="toggleStock('${d.id}','${p.status}')">Stock</button>

<button class="red" onclick="deleteProduct('${d.id}')">Delete</button>

</div>

</div>

</div>

`;

});

total.innerText=t;
out.innerText=o;

}

window.deleteProduct=async(id)=>{

if(confirm("Delete Product?")){

await deleteDoc(doc(db,"products",id));

load();

}

};

window.toggleStock=async(id,s)=>{

await updateDoc(doc(db,"products",id),{

status:s==="In Stock"?"Out of Stock":"In Stock"

});

load();

};

window.editProduct=async(id,n,p,s)=>{

const nn=prompt("Name",n);
const np=prompt("Original Price",p);
const ns=prompt("Sale Price",s);

if(nn&&np&&ns){

await updateDoc(doc(db,"products",id),{

name:nn,
price:np,
salePrice:ns

});

load();

}

};

load();

</script>

</body>
</html>
