<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shoe Collection</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HEADER -->

<header>

<div class="logo">

👟 <span>Shoe Collection</span>

</div>

<div class="nav-right">

<div class="icon-btn">❤️</div>

<div class="icon-btn">

🛒

<span class="cart-count" id="cartCount">0</span>

</div>

<a href="admin.html" class="admin-btn">Admin</a>

</div>

</header>

<!-- HERO -->

<section class="hero">

<h1>Premium Sneakers Collection</h1>

<p>Modern Style • Premium Comfort • Best Prices</p>

<a href="#shop" class="hero-btn">Shop Now</a>

</section>

<!-- SHOP -->

<section id="shop" class="container">

<input
id="search"
class="search"
placeholder="Search Shoes...">

<div class="filters">

<button class="filter-btn active">All</button>

<button class="filter-btn">Nike</button>

<button class="filter-btn">Adidas</button>

<button class="filter-btn">Puma</button>

<button class="filter-btn">Sports</button>

</div>

<div id="products" class="products">

<!-- Firebase Products -->

</div>

</section>

<!-- BUY NOW MODAL -->

<div id="modal" class="modal">

<div class="modal-box">

<h2>Complete Your Order</h2>

<input
id="custName"
placeholder="Full Name">

<input
id="custPhone"
placeholder="Mobile Number">

<textarea
id="custAddress"
placeholder="Full Address"></textarea>

<input
id="custCity"
placeholder="City">

<input
id="custPin"
placeholder="PIN Code">

<select id="payment">

<option>Cash On Delivery</option>

<option>UPI Payment</option>

</select>

<button
class="place-btn"
onclick="sendOrder()">

Place Order

</button>

<button
class="close-btn"
onclick="closeModal()">

Cancel

</button>

</div>

</div>

<!-- FOOTER -->

<footer>

<h3>Shoe Collection</h3>

<p>Premium Shoes • Quality First</p>

<p>© 2026 Shoe Collection</p>

</footer>

<!-- SCRIPT -->

<script type="module" src="script.js"></script>

</body>
</html>
