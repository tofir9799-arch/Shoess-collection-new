<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details - Shoe Collection</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{background:#0b0b0b;color:#fff}
.container{max-width:1100px;margin:auto;padding:20px}
.back{display:inline-block;margin-bottom:20px;color:#25D366;text-decoration:none;font-weight:600}
.card{background:#151515;border-radius:20px;overflow:hidden}
.card img{width:100%;height:340px;object-fit:cover}
.info{padding:20px}
.price{font-size:30px;font-weight:700;margin:10px 0}
.stock{display:inline-block;background:#1b5e20;padding:6px 14px;border-radius:20px;margin-bottom:20px}
.sizes{display:flex;gap:10px;margin:15px 0;flex-wrap:wrap}
.size{padding:10px 16px;border:1px solid #444;border-radius:10px}
.btn{display:block;width:100%;padding:16px;background:#25D366;color:#fff;text-align:center;border-radius:12px;text-decoration:none;font-weight:bold;font-size:18px}
</style>
</head>
<body>

<div class="container">
<a href="index.html" class="back">← Back</a>

<div class="card">
<img id="img" src="" alt="">
<div class="info">
<h1 id="name">Loading...</h1>
<div class="price" id="price"></div>
<div class="stock" id="status"></div>

<h3>Select Size</h3>
<div class="sizes">
<div class="size">6</div>
<div class="size">7</div>
<div class="size">8</div>
<div class="size">9</div>
<div class="size">10</div>
</div>

<a id="waBtn" class="btn" target="_blank">Order on WhatsApp</a>
</div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyD8fVEBmZDsbT2HAkeghb9VwviW8Kqe-Ds",
authDomain:"shoess-collection.firebaseapp.com",
projectId:"shoess-collection",
storageBucket:"shoess-collection.firebasestorage.app",
messagingSenderId:"947805916030",
appId:"1:947805916030:web:6a8efeb305c258a78f412f"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const id=new URLSearchParams(location.search).get("id");

if(id){
const snap=await getDoc(doc(db,"products",id));
if(snap.exists()){
const p=snap.data();
document.getElementById("img").src=p.image;
document.getElementById("name").innerText=p.name;
document.getElementById("price").innerText="₹"+p.price;
document.getElementById("status").innerText=p.status||"In Stock";

const msg=encodeURIComponent(`Hello, I want to buy ${p.name} (₹${p.price}).`);
document.getElementById("waBtn").href=`https://wa.me/919460609713?text=${msg}`;
}
}
</script>

</body>
</html>
