<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - Shoe Collection</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#0b0b0b;
color:#fff;
}

header{
position:sticky;
top:0;
background:#111;
padding:18px 20px;
display:flex;
justify-content:space-between;
align-items:center;
}

header h2{
font-size:22px;
}

header a{
color:#fff;
text-decoration:none;
}

.container{
max-width:700px;
margin:auto;
padding:30px 20px;
}

h1{
text-align:center;
margin-bottom:25px;
font-size:36px;
}

form{
display:flex;
flex-direction:column;
gap:16px;
}

input,
textarea,
select{
padding:15px;
background:#151515;
border:1px solid #333;
border-radius:12px;
color:#fff;
font-size:16px;
outline:none;
}

textarea{
height:120px;
resize:none;
}

.order-box{
background:#151515;
padding:20px;
border-radius:16px;
margin:20px 0;
}

.row{
display:flex;
justify-content:space-between;
margin:10px 0;
}

.total{
border-top:1px solid #333;
padding-top:12px;
font-size:22px;
font-weight:bold;
}

button{
padding:16px;
border:none;
border-radius:35px;
background:#25D366;
color:#fff;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.8);
display:none;
justify-content:center;
align-items:center;
padding:20px;
}

.popup-box{
background:#151515;
padding:30px;
border-radius:20px;
text-align:center;
width:100%;
max-width:340px;
}

.popup-box h2{
color:#25D366;
margin-bottom:10px;
}

.popup-box p{
color:#ccc;
margin-bottom:20px;
}

.popup-box a{
display:block;
background:#25D366;
color:#fff;
text-decoration:none;
padding:14px;
border-radius:30px;
font-weight:bold;
}

footer{
margin-top:40px;
padding:20px;
text-align:center;
background:#111;
color:#888;
}
</style>
</head>

<body>

<header>
<h2>SHOE COLLECTION</h2>
<a href="cart.html">← Back</a>
</header>

<div class="container">

<h1>Checkout</h1>

<form id="orderForm">

<input type="text" id="name" placeholder="Full Name" required>

<input type="tel" id="phone" placeholder="Mobile Number" required>

<textarea id="address" placeholder="Delivery Address" required></textarea>

<select id="payment">
<option value="Cash on Delivery">Cash on Delivery</option>
<option value="UPI Payment">UPI Payment</option>
</select>

<div class="order-box">

<div class="row">
<span>Product</span>
<span>Red Air Max</span>
</div>

<div class="row">
<span>Quantity</span>
<span>1</span>
</div>

<div class="row">
<span>Shipping</span>
<span>FREE</span>
</div>

<div class="row total">
<span>Total</span>
<span>₹1999</span>
</div>

</div>

<button type="submit">Place Order</button>

</form>

</div>

<div class="popup" id="popup">

<div class="popup-box">

<h2>Order Ready!</h2>

<p>Your order is ready to send on WhatsApp.</p>

<a id="whatsappLink" href="#">Send on WhatsApp</a>

</div>

</div>

<footer>
© 2026 Shoe Collection. All Rights Reserved.
</footer>

<script>
document.getElementById("orderForm").addEventListener("submit",function(e){

e.preventDefault();

let name=document.getElementById("name").value;
let phone=document.getElementById("phone").value;
let address=document.getElementById("address").value;
let payment=document.getElementById("payment").value;

let message=
`Hi, I want to place an order.

Name: ${name}
Phone: ${phone}
Address: ${address}
Payment: ${payment}

Product: Red Air Max
Quantity: 1
Total: ₹1999`;

document.getElementById("whatsappLink").href=
"https://wa.me/919460609713?text="+encodeURIComponent(message);

document.getElementById("popup").style.display="flex";

});
</script>

</body>
</html>
